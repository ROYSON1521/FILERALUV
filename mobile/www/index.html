}
body, .card, input, select, button {

}

/* 🌙 Dark mode styles */
body.dark {
  background: radial-gradient(ellipse at 16% 18%, rgba(93, 70, 153, .24), transparent 38%), radial-gradient(ellipse at 88% 78%, rgba(24, 119, 122, .18), transparent 40%), linear-gradient(135deg, #171923, #0b1020);

}

  color: #e5e7eb;
}

body.dark input,

  border: 1px solid #374151;
}

body.dark button {
  background: #4f46e5;
}

body.dark .note {
  color: #9ca3af;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
@keyframes fade {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}
/* 🌗 Theme toggle switch */

.switch {
  position: relative;
  display: inline-block;
  flex: 0 0 56px;
  width: 56px;
  height: 30px;
  margin-right: 0;
}

.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.slider {
  position: absolute;
  cursor: pointer;
  inset: 0;
  background-color: #cbd5e1;
  border-radius: 34px;
  transition: background-color 0.3s;
}

.slider::before {
  content: "🥵";
  position: absolute;
  height: 26px;
  width: 26px;
  left: 2px;
  bottom: 2px;
  background-color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.3s;
  font-size: 14px;
}

/* checked = dark mode */
.switch input:checked + .slider {
  background-color: #4f46e5;
}

.switch input:checked + .slider::before {
  transform: translateX(26px);
  content: "🥶";
}
/* 🌐 Top bar */
#topBar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  padding: 12px 20px;
  justify-content: space-between;
  align-items: center;
  box-sizing: border-box;
  z-index: 1000;
  display: none;
}

/* Welcome text */
#welcomeUser {

}

.top-actions {

}

#logoutBtn:hover {

}

/* Dark mode logout */

}

const API_URL = "https://file-converter-backend-0tg6.onrender.com/convert";
const REGISTER_API = "https://file-converter-backend-0tg6.onrender.com/register";
const LOGIN_API = "https://file-converter-backend-0tg6.onrender.com/login";
const extMap = {
  txt_to_pdf: "pdf",
  txt_to_docx: "docx",
  pdf_to_txt: "txt",
  docx_to_txt: "txt",
  pdf_to_docx: "docx",
  jpg_to_png: "png",
  jpeg_to_png: "png",
  png_to_jpeg: "jpeg",
  webp_to_jpeg: "jpeg",
  webp_to_png: "png",
  mp3_to_m4a: "m4a",
  mp3_to_wav: "wav",
  mp3_to_flac: "flac",
  m4a_to_wav: "wav",
  docx_to_pdf: "pdf",
  pptx_to_pdf: "pdf"
};
const conversionsByExtension = {
  txt: ["txt_to_pdf", "txt_to_docx"],
  pdf: ["pdf_to_txt", "pdf_to_docx"],
  docx: ["docx_to_txt", "docx_to_pdf"],
  pptx: ["pptx_to_pdf"],
  jpg: ["jpg_to_png"],
  jpeg: ["jpeg_to_png"],
  png: ["png_to_jpeg"],
  webp: ["webp_to_jpeg", "webp_to_png"],
  mp3: ["mp3_to_m4a", "mp3_to_wav", "mp3_to_flac"],
  m4a: ["m4a_to_wav"]
};
let pendingDownload = null;

// 🔒 Bonus fix: auto-login after refresh (DOM safe)
window.addEventListener("DOMContentLoaded", () => {
  // Wake a sleeping free-tier backend while the user is on the login page.
  fetch(REGISTER_API.replace(/\/register$/, "/health"), { cache: "no-store" }).catch(() => {});
  // 🌗 sync theme toggle
   const savedTheme = localStorage.getItem("theme");
if (savedTheme === "dark") {
  document.body.classList.add("dark");
  document.getElementById("themeSwitch").checked = true;
}

// ✅ auto-login check
  // Require a fresh login whenever the site is opened or refreshed.
  localStorage.removeItem("token");
  localStorage.removeItem("loggedIn");
  localStorage.removeItem("username");
  document.getElementById("converterCard").classList.remove("active");
  document.getElementById("registerCard").classList.remove("active");
  document.getElementById("loginCard").classList.add("active");
  document.getElementById("loginStack").classList.add("active");
  document.getElementById("topBar").style.display = "none";
  document.getElementById("fileInput").addEventListener("change", updateAvailableConversions);
  document.getElementById("password").addEventListener("input", updateLoginPasswordToggle);
  lockConversions();
});

// 🌗 Dark / Light mode toggle
function toggleTheme() {
  const isDark = document.body.classList.toggle("dark");

  localStorage.setItem("theme", isDark ? "dark" : "light");
  document.getElementById("themeSwitch").checked = isDark;
}

// 🔁 STEP 2: page switching logic
function showRegister() {
  document.getElementById("username").value = "";
  document.getElementById("password").value = "";
  document.getElementById("registerMessage").className = "auth-message";
  document.getElementById("loginMessage").className = "auth-message";
  document.getElementById("loginStack").classList.remove("active");
  document.getElementById("registerCard").classList.add("active");
}

function showLogin() {
  document.getElementById("registerUsername").value = "";
  document.getElementById("registerPassword").value = "";
  document.getElementById("registerMessage").className = "auth-message";
  document.getElementById("loginMessage").className = "auth-message";
  document.getElementById("registerCard").classList.remove("active");
  document.getElementById("loginStack").classList.add("active");
}

function togglePassword(inputId, button) {
  const input = document.getElementById(inputId);
  const showing = input.type === "password";
  input.type = showing ? "text" : "password";
  button.textContent = showing ? "Hide" : "Show";
  button.setAttribute("aria-pressed", String(showing));
}

function updateLoginPasswordToggle() {
  const password = document.getElementById("password");
  const button = document.getElementById("loginPasswordToggle");
  button.hidden = password.value.length === 0;
  if (button.hidden && password.type === "text") {
    password.type = "password";
    button.textContent = "Show";
    button.setAttribute("aria-pressed", "false");
  }
}

function setAuthMessage(id, message, kind = "error") {
  const element = document.getElementById(id);
  element.textContent = message;
  element.className = `auth-message ${kind} visible`;
}

function lockConversions() {
  const select = document.getElementById("format");
  const convertButton = document.getElementById("convertBtn");
  [...select.options].forEach(option => { option.disabled = true; });
  [...select.querySelectorAll("optgroup")].forEach(group => { group.disabled = true; });
  select.selectedIndex = 0;
  select.disabled = true;
  convertButton.disabled = true;
  document.getElementById("conversionHint").textContent = "";
}

function updateAvailableConversions() {
  clearPendingDownload();
  const file = document.getElementById("fileInput").files[0];
  const select = document.getElementById("format");
  const convertButton = document.getElementById("convertBtn");
  const hint = document.getElementById("conversionHint");
  const extension = file?.name.split(".").pop().toLowerCase();
  const allowed = conversionsByExtension[extension] || [];

  [...select.options].forEach(option => {
    option.disabled = !allowed.includes(option.value);
  });
  [...select.querySelectorAll("optgroup")].forEach(group => {
    group.disabled = ![...group.querySelectorAll("option")].some(option => !option.disabled);
  });
  if (!file || !allowed.length) {
    select.disabled = true;
    convertButton.disabled = true;
    hint.textContent = file ? `No conversions are available for .${extension} files.` : "";
    if (file) document.getElementById("status").textContent = `Unsupported file type: .${extension}`;
    return;
  }

  select.value = allowed[0];
  select.disabled = false;
  convertButton.disabled = false;
  hint.textContent = `${extension.toUpperCase()} detected · ${allowed.length} conversion${allowed.length === 1 ? "" : "s"} available. Other formats are locked.`;
  document.getElementById("status").textContent = "";
}

function clearPendingDownload() {
  if (pendingDownload?.url) URL.revokeObjectURL(pendingDownload.url);
  pendingDownload = null;
  const convertButton = document.getElementById("convertBtn");
  const downloadButton = document.getElementById("downloadBtn");
  if (convertButton) {
    convertButton.hidden = false;
    convertButton.disabled = false;
  }
  if (downloadButton) {
    downloadButton.hidden = true;
    downloadButton.disabled = false;
    downloadButton.textContent = "Download converted file";
  }
}

async function downloadConvertedFile() {
  if (!pendingDownload) return;
  const button = document.getElementById("downloadBtn");
  const status = document.getElementById("status");
  const capacitor = window.Capacitor;
  const nativeDownloader = capacitor?.Plugins?.FileDownloader;
  button.disabled = true;
  button.textContent = "Saving…";

  try {
    if (capacitor?.getPlatform?.() === "android") {
      if (!nativeDownloader?.saveToDownloads) throw new Error("Download support is missing from this app build.");
      const buffer = await pendingDownload.blob.arrayBuffer();
      const bytes = new Uint8Array(buffer);
      const chunks = [];
      const chunkSize = 0x8000;
      for (let offset = 0; offset < bytes.length; offset += chunkSize) {
        chunks.push(String.fromCharCode(...bytes.subarray(offset, offset + chunkSize)));
      }
      await nativeDownloader.saveToDownloads({
        fileName: pendingDownload.fileName,
        mimeType: pendingDownload.mimeType,
        data: btoa(chunks.join(""))
      });
      status.textContent = `Saved to Downloads/FILERALUV/${pendingDownload.fileName}`;
    } else {
      const anchor = document.createElement("a");
      anchor.href = pendingDownload.url;
      anchor.download = pendingDownload.fileName;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      status.textContent = "Download started.";
    }
    button.textContent = "Downloaded ✓";
  } catch (error) {
    status.textContent = "Download failed. Please try again.";
    button.textContent = "Download converted file";
    button.disabled = false;
  }
}

async function login() {
  const user = document.getElementById("username").value.trim();
  const pass = document.getElementById("password").value;

  if (!user || !pass) {
    setAuthMessage("loginMessage", "Enter your username and password.");
    return;
  }
  try {
    const res = await fetch(LOGIN_API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: user, password: pass })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.message || `Server error (${res.status})`);
    if (!data.token) throw new Error("The server did not return a login token");

    localStorage.setItem("token", data.token);
    localStorage.setItem("username", user);
    localStorage.setItem("loggedIn", "true");
   
    const welcomeEmojis = ["✨", "🌟", "🚀", "🎉", "🌈", "🪄", "💫", "🎨"];
    const welcomeEmoji = welcomeEmojis[Math.floor(Math.random() * welcomeEmojis.length)];
    document.getElementById("welcomeUser").textContent = `Welcome, ${user} ${welcomeEmoji}`;
    document.getElementById("logoutBtn").style.display = "block";
    document.getElementById("loginStack").classList.remove("active");
    document.getElementById("converterCard").classList.add("active");
    document.getElementById("topBar").style.display = "flex";
    document.getElementById("username").value = "";
    document.getElementById("password").value = "";
    updateLoginPasswordToggle();
    document.getElementById("fileInput").value = "";
    document.getElementById("status").textContent = "";
    document.getElementById("loginMessage").className = "auth-message";
    lockConversions();
  } catch (err) {
    localStorage.removeItem("token");
    localStorage.removeItem("loggedIn");
    localStorage.removeItem("username");
    setAuthMessage("loginMessage", "Login failed: " + (err.message || "Unable to reach the server"));
  }
}

async function register() {
  const user = document.getElementById("registerUsername").value.trim();
  const pass = document.getElementById("registerPassword").value;
  const registerButton = document.getElementById("registerBtn");

  if (!user || !pass) {
    setAuthMessage("registerMessage", "Enter your username and password.");
    return;
  }
  if (pass.length < 8) {
    setAuthMessage("registerMessage", "Use at least 8 characters, including letters, numbers, and one symbol (#, _, or @).");
    return;
  }
  if (!/^[A-Za-z0-9#_@]+$/.test(pass) || !/[A-Za-z]/.test(pass) || !/[0-9]/.test(pass) || !/[#_@]/.test(pass)) {
    setAuthMessage("registerMessage", "Password needs letters, numbers, and one of these symbols: #, _, @. Other symbols are not allowed.");
    return;
  }

  try {
    registerButton.disabled = true;
    registerButton.textContent = "Creating account…";
    setAuthMessage("registerMessage", "Creating your account…", "success");
    const res = await fetch(REGISTER_API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: user, password: pass })
    });

    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.message || `Server error (${res.status})`);

    const registerMessage = document.getElementById("registerMessage");
    registerMessage.textContent = "Registration successful. You can log in now. Redirecting...";
    registerMessage.className = "auth-message success visible";
    registerButton.textContent = "Registered";
    setTimeout(() => {
      registerButton.disabled = false;
      registerButton.textContent = "Register";
      showLogin();
    }, 700);

  } catch (err) {
    const registerMessage = document.getElementById("registerMessage");
    registerMessage.textContent = "Registration failed: " + (err.message || "Unable to reach the server");
    registerMessage.className = "auth-message error visible";
    registerButton.disabled = false;
    registerButton.textContent = "Register";
  }
}

// 🚪 STEP 3.3: Logout
function logout() {
  localStorage.removeItem("token");
  localStorage.removeItem("loggedIn");
  localStorage.removeItem("username");

  document.getElementById("converterCard").classList.remove("active");
  document.getElementById("registerCard").classList.remove("active");
  document.getElementById("loginStack").classList.add("active");
  document.getElementById("themeSwitch").checked = document.body.classList.contains("dark");
  document.getElementById("topBar").style.display = "none";
  document.getElementById("fileInput").value = "";
  document.getElementById("status").textContent = "";
  clearPendingDownload();
  document.getElementById("password").value = "";
  updateLoginPasswordToggle();
  lockConversions();
}

async function convertFile() {
    const token = localStorage.getItem("token");
    if (!token) {
        setAuthMessage("loginMessage", "Your session expired. Please log in again.");
        logout();
     return;
    }
  const fileInput = document.getElementById('fileInput');

  // ✅ 1. Check if file exists FIRST
  if (!fileInput.files.length) {
    document.getElementById("status").textContent = "Please select a file.";
    return;
  }

  const file = fileInput.files[0];
  const originalName = file.name.split(".").slice(0, -1).join(".");

  // ✅ 2. File validation
  const maxSize = 50 * 1024 * 1024; // 50 MB
  const extension = file.name.split(".").pop().toLowerCase();

  if (!conversionsByExtension[extension]) {
    document.getElementById("status").textContent = "Unsupported file type. Choose a supported file.";
    return;
  }

  if (file.size > maxSize) {
    document.getElementById("status").textContent = "File size exceeds the 50 MB limit.";
    return;
  }

  const format = document.getElementById('format').value;
  if (!conversionsByExtension[extension].includes(format)) {
    document.getElementById("status").textContent = "Choose a conversion available for this file type.";
    return;
  }

  // ✅ 3. Send to backend
  // STEP 2: show spinner + disable button
  const status = document.getElementById("status");
  const btn = document.getElementById("convertBtn");
  const logoutBtn = document.getElementById("logoutBtn");
  fileInput.disabled = true;

  status.innerHTML = '<div class="spinner"></div><p>Converting...</p>';
  btn.disabled = true;
  logoutBtn.disabled = true;
  
  const formData = new FormData();
  formData.append("file", file);
  formData.append("format", format);

  try {
    const token = localStorage.getItem("token");
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
    "Authorization": "Bearer " + token
     },
      body: formData
    });

    if (!response.ok) {
      const text = await response.text();
      throw new Error(text || "Upload failed");
    }

    const blob = await response.blob();
    const url = window.URL.createObjectURL(blob);
    const fileName = `${originalName}.${extMap[format]}`;
    const mimeTypes = {
      pdf: "application/pdf",
      docx: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
      txt: "text/plain",
      png: "image/png",
      jpeg: "image/jpeg",
      m4a: "audio/mp4",
      wav: "audio/wav",
      flac: "audio/flac"
    };
    pendingDownload = { blob, url, fileName, mimeType: mimeTypes[extMap[format]] || "application/octet-stream" };
    fileInput.value = "";
    lockConversions();
    // STEP 3: success message + enable button
    status.textContent = "Conversion successful ✅";
    fileInput.disabled = false;
    btn.hidden = true;
    btn.disabled = false;
    const downloadButton = document.getElementById("downloadBtn");
    downloadButton.hidden = false;
    downloadButton.disabled = false;
    logoutBtn.disabled = false;

  } catch (error) {
    status.textContent = "Conversion failed ❌";
    fileInput.disabled = false;
    btn.disabled = false;
    logoutBtn.disabled = false;
    status.textContent = "Conversion failed ❌";
  }
}
